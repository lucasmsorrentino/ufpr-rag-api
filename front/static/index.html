<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFPR RAG — Consulta de Documentos Institucionais</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --border:#e2e5ea; --fg:#1b1f26; --muted:#5d6570;
    --accent:#1a56b0; --accent-fg:#ffffff; --user-bg:#e8f0fd; --src-bg:#f2f4f7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1216; --panel:#171b21; --border:#2a3039; --fg:#e6e9ee; --muted:#9aa3af;
      --accent:#4b8ef0; --accent-fg:#0f1216; --user-bg:#1d2a3d; --src-bg:#1c2129;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.55}
  .wrap{max-width:840px;margin:0 auto;padding:24px 16px 40px}
  header h1{font-size:1.45rem;margin:0 0 4px}
  header p{margin:0 0 20px;color:var(--muted);font-size:.92rem}
  #chat{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
  .msg{padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel)}
  .msg.user{background:var(--user-bg);border-color:transparent}
  .msg .role{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
             color:var(--muted);margin-bottom:6px}
  .msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
  .fontes{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);
          font-size:.83rem;color:var(--muted)}
  .fontes ul{margin:6px 0 0;padding-left:18px}
  .fontes li{margin-bottom:3px;overflow-wrap:anywhere}
  .meta{font-size:.75rem;color:var(--muted);margin-top:8px}
  form{display:flex;gap:8px}
  input[type=text]{flex:1;padding:12px 14px;border-radius:9px;border:1px solid var(--border);
                   background:var(--panel);color:var(--fg);font-size:1rem;min-width:0}
  button{padding:12px 20px;border:0;border-radius:9px;background:var(--accent);
         color:var(--accent-fg);font-weight:600;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.55;cursor:not-allowed}
  .hint{margin-top:12px;font-size:.82rem;color:var(--muted)}
  .hint code{background:var(--src-bg);padding:1px 5px;border-radius:4px}
  .erro{border-color:#c0392b}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔍 UFPR RAG — Documentos Institucionais</h1>
    <p>Perguntas em linguagem natural sobre resoluções, atas, instruções normativas
       e regulamentos de estágio da UFPR. As respostas citam o documento de origem.</p>
  </header>

  <div id="chat"></div>

  <form id="form">
    <input type="text" id="q" placeholder="Ex: qual o prazo máximo de um estágio obrigatório?"
           autocomplete="off" required>
    <button type="submit" id="btn">Perguntar</button>
  </form>

  <p class="hint">
    API: <code>POST /perguntar</code> · <code>GET /buscar?q=</code> · <code>GET /health</code>
    — documentação interativa em <a href="/docs">/docs</a>.
  </p>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('q');
const btn = document.getElementById('btn');

function add(role, text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + (cls || (role === 'Você' ? 'user' : ''));
  const r = document.createElement('div'); r.className='role'; r.textContent = role;
  const b = document.createElement('div'); b.className='body'; b.textContent = text;
  d.append(r,b); chat.append(d); d.scrollIntoView({behavior:'smooth', block:'end'});
  return d;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pergunta = input.value.trim();
  if(!pergunta) return;
  add('Você', pergunta);
  input.value = '';
  btn.disabled = true;
  const pend = add('Assistente', 'Consultando os documentos…');

  try{
    const resp = await fetch('/perguntar', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pergunta, top_k: 5})
    });
    const data = await resp.json();
    if(!resp.ok){
      pend.querySelector('.body').textContent = 'Erro: ' + (data.detail || resp.status);
      pend.classList.add('erro');
    } else {
      pend.querySelector('.body').textContent = data.resposta;
      if(data.fontes && data.fontes.length){
        const f = document.createElement('div');
        f.className = 'fontes';
        f.innerHTML = '<strong>Fontes consultadas:</strong>';
        const ul = document.createElement('ul');
        data.fontes.forEach(x => {
          const li = document.createElement('li');
          li.textContent = `${x.documento} — ${x.orgao_emissor}`;
          ul.append(li);
        });
        f.append(ul); pend.append(f);
      }
      const m = document.createElement('div');
      m.className = 'meta'; m.textContent = 'modelo: ' + data.modelo;
      pend.append(m);
    }
  }catch(err){
    pend.querySelector('.body').textContent = 'Falha de rede: ' + err.message;
    pend.classList.add('erro');
  }finally{
    btn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
